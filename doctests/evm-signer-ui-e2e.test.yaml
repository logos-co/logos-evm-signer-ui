name: "Approving a signature: request, render, password, signature"
output: evm-signer-ui-e2e.md
release: ""

intro: |
  This doc-test proves the whole point of `evm_signer_ui`: **a module can ask for a
  signature, but only a human can produce one.**

  It runs the real chain headlessly — a requesting module, the signer manager, the
  keystore, and the signer UI — and drives the UI the way a person would, through
  [`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp):

  1. `signer_probe` names who holds the roles: the keystore's custodian
     (`signer_probe`) and manager (`signer_manager_module`), and the manager's
     approver (`evm_signer_ui`) and signer (`keystore_module`).
  2. `signer_probe` (a requester) imports a known key and asks the manager for a
     signature on a message.
  3. The manager parks the request and announces it.
  4. `evm_signer_ui` — the only module allowed to approve — acknowledges receipt and
     renders **the manager's own words**, verbatim.
  5. The password is typed into the UI and Approve is clicked; the manager has the
     keystore sign and checks the signatures.
  6. The requester collects a real secp256k1 signature with its receipt.
  7. `signer_probe`, playing the keys app, unlocks the account for its own requests, each
     signature confirmed, and asks again: the signer says the account is unlocked, shows no
     password field, and the approval needs nothing typed.

  Every refusal on the way is asserted too, because they are the design: the
  requester can ask and collect but can never approve, and nothing signs until
  the human acts.

what_you_build: "The keystore, the signer manager, the signer UI and a requesting module, run together in a headless app and driven through the real QML surface to produce one signature."

what_you_learn:
  - "Why signing needs an approver at all — and what the signer manager shows the human"
  - "How approving, requesting and account mutation are separated by caller identity"
  - "Why naming one role means naming them all, and what an unnamed role admits"
  - "Why the requester re-offers when nobody is listening, and what it tells the user"
  - "How to drive a Logos UI plugin headlessly and assert on what it rendered"

prerequisites:
  - |
    **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).
  - "**A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required."

sections:
  - title: "Build the pieces"
    step: true
    text: |
      Four modules and a host. `signer_probe` is a doc-test fixture that lives
      in this repo: something has to *ask* for a signature, and it has to be a
      named module, because the manager refuses the host anchor and therefore
      refuses the CLI. It also imports the key it later asks to sign with, which
      is account mutation — so it has to hold the keystore's custodian role too;
      the next section is where that is arranged.
    steps:
      - title: "The host and the test driver"
        run: |
          set -euo pipefail
          nix build 'github:logos-co/logos-standalone-app' --no-write-lock-file -o result-app
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp
        code_block: |
          set -euo pipefail
          nix build 'github:logos-co/logos-standalone-app' --no-write-lock-file -o result-app
          nix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp

      # Its own step ON PURPOSE: the harness dispatches
      #   if file / elif run / elif ui_test / elif check_file
      # so a check_file sharing a step with run: is NEVER evaluated. All
      # five of these were dead, and the build steps were proving only
      # that nix exited 0, never that it produced anything.
      - title: "The runtime and driver really landed"
        check_file: "result-app"

      # One build per step. A single step running four builds reports only the
      # LAST one's exit code, so three of them can fail while the step goes
      # green -- which is exactly what happened here the first time.
      #
      # --no-write-lock-file on every remote build: these flakes do not commit a
      # flake.lock, so nix wants to write one into a read-only source and fails
      # with "cannot write modified lock file".
      - title: "Build the keystore"
        run: "nix build 'github:logos-co/logos-evm-keystore-module/e4c6fcd39411f0ed52083f0a7fb2701e742f81f1#install' --no-write-lock-file -o result-keystore"
        code_block: "nix build 'github:logos-co/logos-evm-keystore-module#install' --no-write-lock-file -o result-keystore"

      # Its own step ON PURPOSE: the harness dispatches
      #   if file / elif run / elif ui_test / elif check_file
      # so a check_file sharing a step with run: is NEVER evaluated. All
      # five of these were dead, and the build steps were proving only
      # that nix exited 0, never that it produced anything.
      - title: "The keystore really produced modules"
        check_file: "result-keystore/modules"

      - title: "Build the signer manager"
        run: "nix build 'github:logos-co/logos-signer-manager-module/308b151c7460cff2300cbc8cc338f04cd7442a6a#install' --no-write-lock-file -o result-manager"
        code_block: "nix build 'github:logos-co/logos-signer-manager-module#install' --no-write-lock-file -o result-manager"

      - title: "The signer manager really produced modules"
        check_file: "result-manager/modules"

      - title: "Build the signer UI"
        run: "nix build 'github:logos-co/logos-evm-signer-ui{release}#install' --no-write-lock-file -o result-signer"
        code_block: "nix build 'github:logos-co/logos-evm-signer-ui#install' --no-write-lock-file -o result-signer"

      # Its own step ON PURPOSE: the harness dispatches
      #   if file / elif run / elif ui_test / elif check_file
      # so a check_file sharing a step with run: is NEVER evaluated. All
      # five of these were dead, and the build steps were proving only
      # that nix exited 0, never that it produced anything.
      - title: "The signer UI really produced a plugin"
        check_file: "result-signer/plugins"

      - title: "Build the requesting module"
        run: "nix build 'github:logos-co/logos-evm-signer-ui{release}?dir=doctests/requester#install' --no-write-lock-file -o result-probe"
        code_block: "nix build 'github:logos-co/logos-evm-signer-ui?dir=doctests/requester#install' --no-write-lock-file -o result-probe"

      # Its own step ON PURPOSE: the harness dispatches
      #   if file / elif run / elif ui_test / elif check_file
      # so a check_file sharing a step with run: is NEVER evaluated. All
      # five of these were dead, and the build steps were proving only
      # that nix exited 0, never that it produced anything.
      - title: "The probe really produced a module"
        check_file: "result-probe/modules"

      - title: "Build the token list"
        text: |
          An OPTIONAL dependency: the signer loads and signs without it, and the
          section below proves that by naming only what it can. It is staged here
          so the unverified layer can read the custom token seeded below. The
          decoder now verifies every EVM token in the shipped Uniswap list, so a
          made-up address is the honest way to keep exercising this weaker layer.
        run: "nix build 'github:logos-co/logos-evm-token-list-module{release}#install' --no-write-lock-file -o result-tokenlist"
        code_block: "nix build 'github:logos-co/logos-evm-token-list-module#install' --no-write-lock-file -o result-tokenlist"

      - title: "The token list really produced modules"
        check_file: "result-tokenlist/modules"

      - title: "Build capability_module"
        text: |
          Not bundled with the standalone host. Without it every token handshake
          times out and every call is refused, so it is staged explicitly rather
          than assumed.
        run: "nix build 'github:logos-co/logos-capability-module#install' --no-write-lock-file -o result-capability"
        code_block: "nix build 'github:logos-co/logos-capability-module#install' --no-write-lock-file -o result-capability"

      # Its own step ON PURPOSE: the harness dispatches
      #   if file / elif run / elif ui_test / elif check_file
      # so a check_file sharing a step with run: is NEVER evaluated. All
      # five of these were dead, and the build steps were proving only
      # that nix exited 0, never that it produced anything.
      - title: "capability_module really produced modules"
        check_file: "result-capability/modules"

      - title: "Lay them out for the host"
        text: |
          `capability_module` is not bundled with the standalone host, and without
          it every token handshake times out and calls are refused — so it is
          staged alongside the others rather than assumed.
        run: |
          set -euo pipefail
          mkdir -p tree/modules tree/plugins
          cp -r result-keystore/modules/*   tree/modules/
          cp -r result-manager/modules/*    tree/modules/
          cp -r result-probe/modules/*      tree/modules/
          cp -r result-capability/modules/* tree/modules/
          cp -r result-tokenlist/modules/*  tree/modules/
          cp -r result-signer/plugins/*     tree/plugins/
          chmod -R u+w tree
          ls tree/modules tree/plugins
        code_block: |
          mkdir -p tree/modules tree/plugins
          cp -r result-keystore/modules/*   tree/modules/
          cp -r result-manager/modules/*    tree/modules/
          cp -r result-probe/modules/*      tree/modules/
          cp -r result-capability/modules/* tree/modules/
          cp -r result-tokenlist/modules/*  tree/modules/
          cp -r result-signer/plugins/*     tree/plugins/
        expect_contains:
          - "keystore_module"
          - "signer_manager_module"
          - "signer_probe"
          - "evm_signer_ui"

  - title: "Run it and approve a signature"
    step: true
    text: |
      The host loads the requester with `--load` and shows the signer UI. Two
      environment variables matter and are not optional:

      - `QT_FORCE_STDERR_LOGGING=1` — otherwise Qt routes the app's own
        diagnostics to journald and a failure prints **nothing at all**.
      - `QML_INSPECTOR_PORT=3768` — the QML inspector is compiled in but only
        listens when this is set.
    steps:
      - title: "Name who holds the roles"
        text: |
          Nothing here may touch the keystore or the manager until each is told
          who holds its roles. `signer_manager_module` gates **approval**
          (`pending`, `acknowledge`, `approve`, `reject`) on a configured
          *approver* and asks only its configured *signers* to sign.
          `keystore_module` gates **account mutation** (`import_private_key` and
          its siblings) on a configured *custodian*, and **signing** on a
          configured *manager*. `signer_probe` imports a key, so it needs the
          keystore's custodian role — without it the run stops on its very first
          call with the keystore's uniform refusal, `not authorized`.

          So `signer_probe` makes two calls before anything else:

          ```json
          keystore_module.configure({"custodians": "signer_probe", "managers": "signer_manager_module"})
          signer_manager_module.configure({"approvers": "evm_signer_ui", "custodians": ["evm_keystore_ui", "signer_probe"], "signers": "keystore_module"})
          ```

          **Every role in each call, deliberately.** `configure` is *total*, not
          a patch: the document is the whole answer to who holds these roles, so
          one it does not name is held by **nobody** — an empty name admits no
          caller. Leaving out the manager's approver would refuse `evm_signer_ui`
          itself, which is the half of this doc-test that matters; leaving out
          its signers would leave nothing to sign with.

          **Who gets which, and why.** The approver stays `evm_signer_ui`: it is the
          subject here, the surface a human reads and clicks, and moving that
          role anywhere else would leave nothing to test. The keystore's custodian
          is `signer_probe`, because in this staged tree there is no other
          candidate — production's custodian is `evm_keystore_ui`, which is not
          installed here, and a role naming an absent module admits nobody.

          Two honest caveats. `configure` is **ungated for now**, so this is the
          requester writing the policy that then constrains it; nothing stops a
          hostile co-resident module doing the same, and the protection is
          deferred rather than refuted. And the fixture wears both hats, which
          production would not: a wallet asks for signatures and reads which
          accounts exist, and never imports a key.

          The calls come from the module rather than a command line because
          `logos-standalone-app` has no CLI — and the host anchor a CLI
          authenticates as is refused by the manager regardless, which is why
          `signer_probe` exists at all. They take effect on the next call;
          nothing is reloaded.

      - title: "Launch, approve, and collect the signature"
        # The runner gives the UI driver 120s plus every step's own timeout, so each
        # timeout below bounds its step, not the whole run.
        #
        # The two environment variables are set inline, not as a separate `env:`
        # block, because the runner does not carry one — and neither is optional:
        #   QML_INSPECTOR_PORT   the QML inspector is compiled in but only
        #                        listens when this is set, so without it qt-mcp
        #                        has nothing to connect to.
        #   QT_FORCE_STDERR_LOGGING  Qt prefers journald where it is available,
        #                        so without it a failure in this app prints
        #                        NOTHING — not the QML error, not the ui-host
        #                        timeout. An absent warning then reads as a
        #                        passed check.
        #
        # token_list_module is NOT named here. It is staged in the tree and the
        # plugin declares it optional, and the host is expected to work that out
        # -- which is the whole path a user takes, since nobody names an optional
        # module by hand. Naming it would test a configuration that never ships
        # and would hide a regression in the host's own resolution.
        #
        # It only became true recently: both hosts used to root the widened walk
        # in the REQUIRED list alone, so a plugin's own optional edge was never a
        # root (standalone-app#51, basecamp#409, and the projection it needs in
        # logos-package-manager-module#68).
        ui_test:
          setup:
            - |
              python3 - <<'PY'
              import json
              from pathlib import Path

              directory = Path("userdir/module_data/token_list_module/000000000000")
              directory.mkdir(parents=True, exist_ok=True)
              tokens = [{
                  "chainId": 1,
                  "address": "0x1234567890abcdef1234567890abcdef12345678",
                  "name": "Doc Test USD",
                  "symbol": "DTEST",
                  "decimals": 6,
              }]
              (directory / "custom_tokens.json").write_text(json.dumps(tokens))
              PY
          launch: "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/evm_signer_ui -m ./tree/modules --load signer_probe -u ./userdir"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "The signer UI connects to its backend"
              action: wait_for
              texts: ["Refresh"]
              timeout: 20000

            - name: "The manager parks the request and the UI claims it"
              # `acknowledge` means 'this approver has it on screen', not 'the human
              # decided' — the UI claims receipt itself, because the manager gives
              # an approver a minute and gives the human no deadline at all.
              action: wait_for
              # The heading carries the section number, and `findByProperty` matches the
              # `text` property EXACTLY — so this is the whole rendered string, as for
              # sections 2 and 3 below. Asserting the bare name silently waits out the
              # timeout and reports it as if the request had never been claimed.
              texts: ["1.  Requested by: signer_probe"]
              # 35s, and it is load-bearing: cutting this to 20s to buy headroom
              # under the driver cap failed here with
              # `Expected texts not found: ["1.  Requested by: signer_probe"]`.
              # Cold start plus the first cross-module call is genuinely slow on
              # a loaded box. The headroom came out of the two waits below
              # instead, which are now bounded by real mechanisms.
              timeout: 35000

            - name: "The screen is in three sections, and says which is whose"
              # The manager returns its lines in two lists and this view keeps them
              # apart. probe_sections.qml asserts the separation against a fabricated
              # backend; this asserts the headings a human actually reads, with a real
              # manager behind them. Section 1's heading carries the requester's name
              # and so is asserted by the requester line below instead.
              action: wait_for
              texts:
                - "2.  What you are signing"
                - "3.  What this signer makes of section 2"
              timeout: 6000

            - name: "The human is shown the manager's own words, not the requester's"
              action: wait_for
              texts:
              # EXACT strings. The matcher is findByProperty on `text`, so it is
              # equality, not substring: "Commitment:" never matches the rendered
              # "Commitment: <hex>", and the per-leg lines carry six leading spaces
              # from the manager's own formatting. The commitment itself is not
              # asserted because it changes every run; the leg count and the message
              # text are stable and say as much.
                - "Account: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
                - "Purpose (claimed by the requester): Doc-test: sign one message end to end"
                - "3 item(s) to sign:"
                - "      Text: I authorise the doc-test transfer"
              timeout: 6000

            - name: "The calldata is decoded on this device, and says so"
              # The manager never authored these lines: the backend decoded the
              # `Data:` line above with the linked-in logos-tx-decoder and
              # published them separately. VERIFIED is the strong tier -- the
              # recipient IS the WETH contract on chain 1 in the decoder's own
              # database, not merely a 4-byte selector that matched.
              action: wait_for
              texts:
                - "Decoded on this device from the lines above. Not part of what is signed, and every line says how sure it is."
                - "Item [2]:"
                - "Interpreted: WETH — VERIFIED (this address is WETH on chain 1, and it declares this function)"
                - "  Function: transfer(address,uint256)"
              timeout: 6000
              screenshot: "evm-signer-ui-approval.png"

            - name: "A token list may NAME an address the database cannot verify"
              # Item [3] uses a made-up address, which the decoder's ABI database
              # cannot hold, so its own reading stops at the selector. A custom token
              # list entry is allowed to speak only here, and only as a name: the
              # wording is the same sentence evm_signer_cli prints, because one
              # request read on two surfaces must not say two different things.
              #
              # The amount matters as much as the name. 2500000 is 2.5 DTEST at the
              # list's 6 decimals and 0.0000000000025 at the 18 a surface might assume.
              action: wait_for
              texts:
                - "Item [3]:"
                - "Token list (custom) says this address is DTEST (Doc Test USD) — a NAME, not a check of the code."
                - "  If that reading is right, the amount is 2.5 DTEST."
              timeout: 6000

            - name: "...and stays silent over the address it CAN verify"
              # The absence assertion, and the reason the Repeater has a name.
              # WETH is in the very same token list -- with a name and 18 decimals --
              # so nothing but the confidence check keeps it out of item [2]. Deleting
              # that check adds two lines under a VERIFIED heading and moves this count,
              # which is what makes this an assertion rather than a restatement.
              #
              # Counted from a live run, not predicted.
              action: expect_property
              find_by: "objectName"
              find_value: "interpretationLines"
              property: "count"
              # 14 = 6 decoder lines for item [2] + 6 for item [3] + the 2 the token
              # list adds to [3] alone. Deleting the confidence check above makes it
              # 16, with WETH's own name and 18-decimal amount printed under the word
              # VERIFIED -- measured, by building that mutant and running it.
              value: 14

            - name: "Type the vault password"
              action: set_text
              find_by: "objectName"
              find_value: "vaultPasswordField"
              value: "doctest-pw"

            - name: "Approve arms only after the dwell"
              # The button's label IS the state: it reads "Reading…" until the
              # sheet has been up for the dwell period, and the backend refuses
              # an early approval regardless of what the view believes. Waiting
              # for the label is therefore both the precondition and the
              # assertion -- and it is deterministic, unlike a sleep. macOS
              # clicked before the dwell fired and got
              # "No clickable element found with text 'Approve'".
              action: wait_for
              texts: ["Approve"]
              # kDwellMs is 500, so 5s is ten times the mechanism being waited on.
              timeout: 5000

            - name: "Approve"
              # `click` matches the QObject `text` property by EQUALITY -- the
              # generator always emits `app.click(target, { exact: true })`, and
              # wait_for/expectTexts use findByProperty, which is equality too.
              # (Substring matching applies only to hand-written .mjs calling
              # app.click with no opts.) An earlier comment here claimed
              # substring and drove a needless rewording of the requester's
              # purpose line; the rewording is harmless and stays, but the
              # reasoning was wrong.
              action: click
              target: "Approve"

            - name: "The keystore signed it through the manager, and the surface says so"
              # approve() answers with a COUNT, never the signatures: the approver
              # causes them to exist and never sees them. Only the requester can
              # collect them, and only with the receipt it was handed at request
              # time -- which is why this is the strongest thing this surface can
              # honestly assert.
              action: wait_for
              # THREE items: the message, the WETH transfer and the custom-token transfer.
              # The backend pluralises on signed_count, so this is "items", not "item".
              texts: ["Approved — 3 items signed"]
              timeout: 20000

            - name: "The queue is empty again"
              action: wait_for
              texts: ["No signing requests are waiting."]
              # approve() now drops the request from the queue in the same call
              # stack that records the outcome, so this is immediate rather than
              # waiting on the next poll. It no longer needs a poll-sized budget.
              timeout: 5000
              screenshot: "evm-signer-ui-approved.png"

            - name: "Unlocked for this app: the signer says so, in the CLI's words"
              # The probe, playing the keys app as the manager's custodian, unlocked the account
              # for its own requests with each signature confirmed, and asked again.
              action: wait_for
              texts: ["Signer: keystore_module — this account is unlocked: no password"]
              timeout: 20000

            - name: "No password field while unlocked"
              action: expect_property
              find_by: "objectName"
              find_value: "vaultPasswordField"
              property: "visible"
              value: false

            - name: "Approve arms after the dwell, with nothing typed"
              action: wait_for
              texts: ["Approve"]
              timeout: 5000

            - name: "Approve, unlocked"
              action: click
              target: "Approve"

            - name: "Signed inside the unlock"
              action: wait_for
              texts: ["Approved — 1 item signed"]
              timeout: 20000
              screenshot: "evm-signer-ui-unlocked.png"

            - name: "A Bitcoin send, as the manager reads the PSBT"
              # The probe imports the test phrase as a regtest wallet and asks for a 60,000-sat
              # send with 39,000 back as change. The PSBT is built offline and never broadcast.
              action: wait_for
              texts:
                - "Purpose (claimed by the requester): Doc-test: a regtest send"
                - "  [1] Bitcoin regtest · wallet \"Regtest wallet\", native segwit, account 0"
                - "      Send 0.00060000 BTC to bcrt1qw508d6qejxtdg4y5r3zarvary0c5xw7kygt080"
                - "      Change 0.00039000 BTC back to this wallet (m/84'/1'/0'/1/0, checked)"
                - "      Fee 1,000 sats, about 7.1 sat/vB, computed from the inputs"
                - "Signer: keystore_module — asks for the account's password"
              timeout: 30000
              screenshot: "evm-signer-ui-bitcoin.png"

            - name: "Type the wallet's password"
              action: set_text
              find_by: "objectName"
              find_value: "vaultPasswordField"
              value: "btc-pw"

            - name: "Approve arms after the dwell, for the send"
              action: wait_for
              texts: ["Approve"]
              timeout: 5000

            - name: "Approve the send"
              action: click
              target: "Approve"

            - name: "Signed: the app unlocks the wallet and asks again"
              # The status line reads as it did after the last round, so wait on the next
              # request, which the probe makes only once it holds the signed PSBT.
              action: wait_for
              texts:
                - "Purpose (claimed by the requester): Doc-test: a regtest send, unlocked"
                - "Signer: keystore_module — this account is unlocked: no password"
              timeout: 30000

            - name: "No password field for the unlocked wallet"
              action: expect_property
              find_by: "objectName"
              find_value: "vaultPasswordField"
              property: "visible"
              value: false

            - name: "Approve arms after the dwell, for the unlocked send"
              action: wait_for
              texts: ["Approve"]
              timeout: 5000

            - name: "Approve the unlocked send"
              action: click
              target: "Approve"

            - name: "The queue is empty after the unlocked send"
              action: wait_for
              texts: ["No signing requests are waiting."]
              timeout: 20000

            - name: "Let the probe collect it"
              # It polls every 250 ms; the app is stopped as soon as this list ends.
              action: sleep
              ms: 2000

      - title: "What the probe collected from the Bitcoin sends"
        text: |
          Each PSBT came back with its one input signed: once with the wallet's password, once
          inside the unlock.
        run: "grep -h 'SIGNER_PROBE_PSBT' ui-test-app.log"
        expect_contains:
          - "SIGNER_PROBE_PSBT_SIGNED: 1"
          - "SIGNER_PROBE_PSBT_SIGNED_UNLOCKED: 1"



  - title: "The same plugin inside Basecamp"
    step: true
    text: |
      The section above runs the signer in `logos-standalone-app`, which is what
      makes the flow drivable: the QML inspector attaches to exactly **one**
      QQuickWidget, and Basecamp gives every `ui_qml` plugin its own. Once a
      plugin is open there, the shell — and therefore any second app — is
      invisible to the driver, so the two-app version of this flow (a wallet
      asking, the signer approving) cannot be driven end-to-end today. That is a
      limitation of the test driver, not of the plugin.

      What Basecamp *does* add is the real shell: the QML sandbox, the shared
      `Logos.*` module resolution, and the portable variant contract. So this
      section asserts exactly that much — the plugin installs, loads, and renders
      there — and nothing it cannot honestly show.
    steps:
      - title: "Build Basecamp and the portable variants"
        text: |
          Basecamp takes **portable** packages (`linux-amd64`); the standalone
          host takes **dev** ones (`linux-amd64-dev`). Installing the wrong
          variant is not an error — the module is silently skipped with a
          "not supported on this platform" warning and simply never loads.
        run: |
          set -euo pipefail
          nix build 'github:logos-co/logos-basecamp#bin-bundle-dir-inspector' --no-write-lock-file -o result-basecamp
          nix build 'github:logos-co/logos-evm-keystore-module/e4c6fcd39411f0ed52083f0a7fb2701e742f81f1#install-portable' --no-write-lock-file -o result-keystore-p
          nix build 'github:logos-co/logos-signer-manager-module/308b151c7460cff2300cbc8cc338f04cd7442a6a#install-portable' --no-write-lock-file -o result-manager-p
          nix build 'github:logos-co/logos-evm-signer-ui{release}#install-portable' --no-write-lock-file -o result-signer-p
          mkdir -p bctree/modules bctree/plugins
          cp -r result-keystore-p/modules/* bctree/modules/
          cp -r result-manager-p/modules/*  bctree/modules/
          cp -r result-signer-p/plugins/*   bctree/plugins/
          chmod -R u+w bctree
          # Assert the PROPERTY, not one platform's spelling of it. The variant
          # is linux-amd64 here and darwin-* elsewhere, so matching the literal
          # string only ever passed on Linux. What matters is that it is the
          # portable build: a "-dev" variant installs without complaint and then
          # never loads, with only a "not supported on this platform" warning.
          variant="$(cat bctree/plugins/evm_signer_ui/variant)"
          case "$variant" in
            *-dev) echo "WRONG VARIANT (dev build): $variant"; exit 1 ;;
            *)     echo "PORTABLE VARIANT OK: $variant" ;;
          esac
        code_block: |
          nix build 'github:logos-co/logos-basecamp#bin-bundle-dir-inspector' --no-write-lock-file -o result-basecamp
          nix build 'github:logos-co/logos-evm-keystore-module#install-portable' --no-write-lock-file -o result-keystore-p
          nix build 'github:logos-co/logos-signer-manager-module#install-portable' --no-write-lock-file -o result-manager-p
          nix build 'github:logos-co/logos-evm-signer-ui#install-portable' --no-write-lock-file -o result-signer-p
        expect_contains:
          - "PORTABLE VARIANT OK"

      - title: "It loads and renders in the shell"
        ui_test:
          # Wait for the section above to RELEASE port 3768 before launching.
          #
          # This app must listen on 3768 and no other port: the generated node
          # driver reads QML_INSPECTOR_PORT from ITS OWN environment
          # (framework.mjs: `process.env.QML_INSPECTOR_PORT || "3768"`), and the
          # spec cannot set that -- `inspector_port:` steers only the harness's
          # readiness wait, and the env in `launch:` reaches the app alone. So
          # moving the app to 3769 does not move the driver, and the section can
          # then only fail.
          #
          # The real hazard is the previous app. The harness kills its process
          # group and waits 10s; a lingering standalone-app or ui-host can still
          # hold 3768, in which case Basecamp fails to listen and the driver
          # attaches to the LEFTOVER SIGNER UI -- which has no shell text. That
          # surfaces as `Expected texts not found: ["Workspace"]` and reads
          # exactly like a wrong label, which is how it was misdiagnosed twice.
          # Measured: Basecamp itself paints "Workspace", "Welcome Back," and the
          # evm_signer_ui tile at t=4.0-4.2s, so a missing shell is never slowness.
          setup:
            - |
              python3 - <<'PY'
              import socket, sys, time
              for i in range(90):
                  s = socket.socket(); s.settimeout(0.5)
                  try:
                      s.connect(("127.0.0.1", 3768)); s.close()
                  except OSError:
                      print("inspector port 3768 free after %ds" % i); sys.exit(0)
                  time.sleep(1)
              print("port 3768 STILL HELD after 90s -- the previous app outlived "
                    "its process group; Basecamp would fail to listen and the "
                    "driver would attach to the leftover UI")
              sys.exit(1)
              PY
          launch: "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-basecamp/bin/LogosBasecamp --user-dir ./bctree"
          qt_mcp: "result-mcp"
          launch_timeout: 600
          tests:
            - name: "The shell is up and the app list has been scanned"
              # "Welcome Back," replaces "Welcome to Basecamp!" only once the
              # launcher model is POPULATED -- i.e. the plugin directory has been
              # scanned and the evm_signer_ui tile exists. Waiting on "Workspace"
              # alone proves the shell painted, not that there is anything to
              # click, so the click below would race the scan.
              action: wait_for
              texts: ["Welcome Back,", "Workspace"]
              # Measured at t=4.1s against this exact build and staged tree, so
              # 30s is ~7x margin. A failure here means the driver is talking to
              # the wrong app, not that Basecamp is slow -- raising this number
              # has never once helped.
              timeout: 30000

            - name: "The tile carries the display_name, not the package name"
              # The point of `display_name`, asserted where a user would read it.
              # SidebarPanel.qml renders `displayName || name`, so without the
              # metadata key this reads "evm_signer_ui" and this fails -- which is
              # what makes it a test of the label rather than of the sidebar.
              action: expect_property
              find_value: "sidebar.app.evm_signer_ui"
              property: "text"
              value: "Signer"

            - name: "Open the Signer from the sidebar"
              # Nothing opens an app on its own: Basecamp loads a ui_qml plugin
              # only when its tile is clicked, and its dependencies with it. The
              # earlier version of this section asserted "Refresh" and passed
              # without ever opening the plugin -- "Refresh" is an unconditional
              # literal in the shell, so it was a false positive on a view that
              # was not there.
              #
              # Click the objectName, not the label: tiles render ICON-ONLY (the
              # name is a hover tooltip), and SidebarPanel.qml carries
              # `sidebar.app.<name>` expressly as the automation handle. Matching
              # the visible text instead would re-break this section every time
              # the label is edited -- as adding `display_name` just did. No
              # "Workspace" click is needed first: section 0 is the startup default.
              action: click_object
              find_value: "sidebar.app.evm_signer_ui"

            - name: "The signer surface is up inside Basecamp"
              # Plugin-specific text, so it cannot match the shell. Reaching it
              # means the plugin loaded, its backend was admitted, and its QML
              # compiled under Basecamp's sandbox -- which is the whole of what
              # this section claims.
              action: wait_for
              texts: ["No signing requests are waiting."]
              timeout: 45000
              screenshot: "evm-signer-ui-basecamp.png"

