-offers when nobody is listening, and what it tells the user\n- How to drive a Logos UI plugin headlessly and assert on what it rendered\n\n## Prerequisites\n\n- **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).\n\n- **A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required."}, {"execs": [], "md": "## Step 1: Build the pieces\n\nThree modules and a host. `signer_probe` is a doc-test fixture that lives\nin this repo: something has to *ask* for a signature, and it has to be a\nnamed module, because Tier B refuses the host anchor and therefore refuses\nthe CLI. It also imports the key it later asks to sign with, which is\naccount mutation \u2014 so it has to hold the keystore's custodian role too;\nthe next section is where that is arranged."}, {"execs": [{"cmd": "set -euo pipefail\nnix build 'github:logos-co/logos-standalone-app' --no-write-lock-file -o result-app\nnix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp\n", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-standalone-app/a91384291464877c23782e013482a78be8103ebe' into the Git cache...\nunpacking 'github:logos-co/logos-cpp-sdk/44e70310ec7eccb5c1f9bc8221f53c25f80e55d9?narHash=sha256-BlYLllbt5TqVivBBcCtR4zASydZreBuKW6sYh1AAjd0%3D' into the Git cache...\ncopying path '/nix/store/a30408ybri874zphhix5mrcv6x6jq46y-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/v9b35qf2xrs9fmdcwz3pslmnwhhvvywv-source' from 'https://cache.nix.logos.co/public'...\nunpacking 'github:logos-co/logos-liblogos/3c3377a3c9284571bfebe79d244ef3c2b65a6a23?narHash=sha256-eZaYBC8BSMRjp7YJWQ9Qe0jh4cRBKjZnQ2Lbi4mBPwY%3D' into the Git cache...\ncopying path '/nix/store/a40r69h3i6rcvmlc8anha0fhly7i35dx-source' from 'https://cache.nix.logos.co/ci'...\ncopying path '/nix/store/lzb3phzq99wq4z9prb5yih4ks6kw0xy3-source' from 'https://cache.nix.logos.co/public'...\nunpacking 'github is set."}, {"execs": [], "md": "### 2.1 Name who holds the two keystore roles\n\nNothing here may touch the keystore until it is told who holds its two\nroles. `keystore_module` gates **approval** (Tier A: `pending`,\n`acknowledge`, `approve`, `reject`) on a configured *approver*, and\n**account mutation** (Tier D: `import_private_key` and its siblings)\non a configured *custodian*. `signer_probe` imports a key, so it needs\nthe second one \u2014 without it the run stops on its very first call with\nthe keystore's uniform refusal, `not authorized`.\n\nSo `signer_probe` makes one call before anything else, naming both:\n\n```json\nkeystore_module.configure({\"approvers\": \"evm_signer_ui\", \"custodians\": \"signer_probe\"})\n```\n\n**Both roles in the one call, deliberately.** `configure` is *total*,\nnot a patch: the document is the whole answer to who holds these roles,\nso one it does not name is held by **nobody** \u2014 an empty name admits no\ncaller. Naming only the custodian would strip the approver, and Tier A\nwould then refuse `evm_signer_ui` itself, which is the half of this\ndoc-test that matters.\n\n**Who gets which, and why.** The approver stays `evm_signer_ui`: it is the\nsubject here, the surface a human reads and clicks, and moving that\nrole anywhere else would leave nothing to test. The custodian is\n`signer_probe`, because in this staged tree there is no other\ncandidate \u2014 production's custodian is `evm_keystore_ui`, which is not\ninstalled here, and a role naming an absent module admits nobody.\n\nTwo honest caveats. `configure` is **ungated for now**, so this is the\nrequester writing the policy that then constrains it; nothing stops a\nhostile co-resident module doing the same, and the protection is\ndeferred rather than refuted. And the fixture wears both hats, which\nproduction would not: a wallet asks for signatures and reads which\naccounts exist, and never imports a key.\n\nThe call comes from the module rather than a command line because\n`logos-standalone-app` has no CLI \u2014 and the host anchor a CLI\nauthenticates as is refused by Tier B regardless, which is why\n`signer_probe` exists at all. It takes effect on the next call;\nnothing is reloaded."}, {"execs": [{"cmd": "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/evm_signer_ui -m ./tree/modules --load signer_probe -u ./userdir\n\n# test actions:\n- The signer UI connects to its backend: wait for ['Refresh']\n- The keystore parks the request and the UI claims it: wait for ['1.  Requested by: signer_probe']\n- The screen is in three sections, and says which is whose: wait for ['2.  What you are signing', '3.  What this signer makes of section 2']\n- The human is shown the keystore's own words, not the requester's: wait for ['Account: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266', 'Purpose (claimed by the requester): Doc-test: sign one message end to end', '3 item(s) to sign:', '      Text: I authorise the doc-test transfer']\n- The calldata is decoded on this device, and says so: wait for ['Decoded on this device from the lines above. Not part of what is signed, and every line says how sure it is.', 'Item [2]:', 'Interpreted: WETH \u2014 VERIFIED (this address is WETH on chain 1, and it declares this function)', '  Function: transfer(address,uint256)']\n- A token list may NAME an address the database cannot verify: wait for ['Item [3]:', 'Token list (custom) says this address is DTEST (Doc Test USD) \u2014 a NAME, not a check of the code.', '  If that reading is right, the amount is 2.5 DTEST.']\n- ...and stays silent over the address it CAN verify: expect objectName='interpretationLines' .count == 14\n- Type the vault password: set objectName='vaultPasswordField' to 'doctest-pw'\n- Approve arms only after the dwell: wait for ['Approve']\n- Approve: click 'Approve'\n- The keystore signed it, and the surface says so: wait for ['Approved \u2014 3 items signed']\n- The queue is empty again: wait for ['No signing requests are waiting.']", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Approving a signature: request, render, password, signature: Launch, approve, and collect the signature\n\n1 passed, 0 failed\n\n", "status": "pass"}], "md": "### 2.2 Launch, approve, and collect the signature\n\n```bash\nenv QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/evm_signer_ui -m ./tree/modules --load signer_probe -u ./userdir\n```\n\n![The calldata is decoded on this device, and says so](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdZ1gU1/s38LON3ov0JkoRiIrYRWPv2BWNPbZoNDFqLCgWYiEaO8ZesQQptkRsFEERCygqIsVCsaH0ugvs8+I8v7n2v41dhEjk+3nhtczMOXPajHPPnpllmZiYEAAAAAAAaBrYX7oAAAAAAADw70EAAAAAAADQhCAAAAAAAABoQhAAAAAAAAA0IQgAAAAAAACaEAQAAAAAAABNCAIAAAAAAIAmBAEAAAAAAEATggAAAAAAAKAJQQAAAAAAANCEIAAAAAAAAGhCEAAAAAAAADQhCAAAAAAAAJoQBAAAAAAAAE0IAgAAAAAAgCaE+6ULAAAAAACgHBaLpaWlpa2traqqyuVyeTwem/313NeuqakRCARVVVWVlZXFxcUlJSVCobAe80cAAAAAAAD/GTwez9jYWE9PTyAQlJeXl5aWVldXV1dX1+8l8pfFYrE4HA6Hw1FRUTE1NeXxeAUFBbm5uQKBoH7yNzExqZeMAAAAAAAaDovFatasmYGBQWlpaXFxcU1NzZcu0b+EzWZra2tramrm5eV9+PDh80MdBAAAAAAA0NjxeDxra2tCSH5+fnV19ZcuzhfA4XD09fUJIZmZmZ/5VQBHS0urnkoFAAAAAFD/1NTU7OzsKioq8vPzv6apPkoRCoVlZWVcLrdZs2alpaVVVVV1zgoBAAAAAAA0Xjwez9bWtqioqLS09EuX5currKysrq42MTEpKiqq8ySor+dxaQAAAAD4yrBYLGtr6/Ly8vLy8i9dlsaivLy8rKzM2tqaxWLVLQcEAAAAAADQSDVr1owQUlRU9KUL0rjQBqGNUwcIAAAAAACgMeLxeAYGBvn5+V+6II1Rfn6+oaEhj8erQ1oEAAAAAADQGBkbG9PX/H/pgjRG1dXVJSUlxsbGdUiLAAAAAAAAGh0Wi6Wnp1dcXPylC9J4FRcX6+rq1uFJAAQAAAAAANDoaGlpCQSCpvNrX3VQU1NTVVVVh1d6IgAAAAAAgEZHW1sbb/6pVXl5uba2trKpEAAAAAAAQKOjqqrK5/O/dCkaOz6fr6qqqmwqBAAAAAAA0OhwuVw8/lur6urqOrwICAEAAAAAADQ6PB4PAUCtqquruVyusqnqGAAMGDAgJyenbm8eFS8Bm52Zmfnjjz/SP7W1td3c3KSuAgAAAIAmgs1mC4XCL12Kz6KioqKurt6guxAKhWy20tfzSkcMw4cPX7FihZWVVZ1/fFiMUCgMCAi4d+8e/bNXr14+Pj4dOnSQXAUAAAAA8DmCg4OZW9hJSUlhYWEJCQ <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
