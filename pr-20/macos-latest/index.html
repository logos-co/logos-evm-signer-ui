 -o result-tokenlist\n```"}, {"execs": [{"cmd": "check file: result-tokenlist/modules", "kind": "check_file", "note": "Found: /tmp/doctest-test-1g4tvseb/result-tokenlist/modules", "status": "pass"}], "md": "### 1.10 The token list really produced modules"}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-capability-module#install' --no-write-lock-file -o result-capability", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-capability-module/1a1b8b5a1167931afbf41ebaafbe76034e6357a0' into the Git cache...\nunpacking 'github:logos-co/logos-design-system/e43a4817b0febc508ce1c044dd424c08598036a8?narHash=sha256-OXMurChZK6ZmWm%2BMS9FsA9C4tNvuLi1naK333/E3%2BX0%3D' into the Git cache...\nthis path will be fetched (660.7 KiB download, 2.4 MiB unpacked):\n  /nix/store/zlvw304ynr5jn7p7ppbqqdry2dkdq6ha-logos-capability_module-module-lib-install\ncopying path '/nix/store/zlvw304ynr5jn7p7ppbqqdry2dkdq6ha-logos-capability_module-module-lib-install' from 'https://logos-co.cachix.org'...\n", "status": "pass"}], "md": "### 1.11 Build capability_module\n\nNot bundled with the standalone host. Without it every token handshake\ntimes out and every call is refused, so it is staged explicitly rather\nthan assumed.\n\n```bash\nnix build 'github:logos-co/logos-capability-module#install' --no-write-lock-file -o result-capability\n```"}, {"execs": [{"cmd": "check file: result-capability/modules", "kind": "check_file", "note": "Found: /tmp/doctest-test-1g4tvseb/result-capability/modules", "status": "pass"}], "md": "### 1.12 capability_module really produced modules"}, {"execs": [{"cmd": "set -euo pipefail\nmkdir -p tree/modules tree/plugins\ncp -r result-keystore/modules/*   tree/modules/\ncp -r result-probe/modules/*      tree/modules/\ncp -r result-capability/modules/* tree/modules/\ncp -r result-tokenlist/modules/*  tree/modules/\ncp -r result-signer/plugins/*     tree/plugins/\nchmod -R u+w tree\nls tree/modules tree/plugins\n", "exit_code": 0, "kind": "run", "note": "", "output": "tree/modules:\ncapability_module\nkeystore_module\nsigner_probe\ntoken_list_module\n\ntree/plugins:\nevm_signer_ui\n", "status": "pass"}], "md": "### 1.13 Lay them out for the host\n\n`capability_module` is not bundled with the standalone host, and without\nit every token handshake times out and calls are refused \u2014 so it is\nstaged alongside the others rather than assumed.\n\n```bash\nmkdir -p tree/modules tree/plugins\ncp -r result-keystore/modules/*   tree/modules/\ncp -r result-probe/modules/*      tree/modules/\ncp -r result-capability/modules/* tree/modules/\ncp -r result-tokenlist/modules/*  tree/modules/\ncp -r result-signer/plugins/*     tree/plugins/\n```"}, {"execs": [], "md": "## Step 2: Run it and approve a signature\n\nThe host loads the requester with `--load` and shows the signer UI. Two\nenvironment variables matter and are not optional:\n\n- `QT_FORCE_STDERR_LOGGING=1` \u2014 otherwise Qt routes the app's own\n  diagnostics to journald and a failure prints **nothing at all**.\n- `QML_INSPECTOR_PORT=3768` \u2014 the QML inspector is compiled in but only\n  listens when this is set."}, {"execs": [], "md": "### 2.1 Name who holds the two keystore roles\n\nNothing here may touch the keystore until it is told who holds its two\nroles. `keystore_module` gates **approval** (Tier A: `pending`,\n`acknowledge`, `approve`, `reject`) on a configured *approver*, and\n**account mutation** (Tier D: `import_private_key` and its siblings)\non a configured *custodian*. `signer_probe` imports a key, so it needs\nthe second one \u2014 without it the run stops on its very first call with\nthe keystore's uniform refusal, `not authorized`.\n\nSo `signer_probe` makes one call before anything else, naming both:\n\n```json\nkeystore_module.configure({\"approvers\": \"evm_signer_ui\", \"custodians\": \"signer_probe\"})\n```\n\n**Both roles in the one call, deliberately.** `configure` is *total*,\nnot a patch: the document is the whole answer to who holds these roles,\nso one it does not name is held by **nobody** \u2014 an empty name admits no\ncaller. Naming only the custodian would strip the approver, and Tier A\nwould then refuse `evm_signer_ui` itself, which is the half of this\ndoc-test that matters.\n\n**Who gets which, and why.** The approver stays `evm_signer_ui`: it is the\nsubject here, the surface a human reads and clicks, and moving that\nrole anywhere else would leave nothing to test. The custodian is\n`signer_probe`, because in this staged tree there is no other\ncandidate \u2014 production's custodian is `evm_keystore_ui`, which is not\ninstalled here, and a role naming an absent module admits nobody.\n\nTwo honest caveats. `configure` is **ungated for now**, so this is the\nrequester writing the policy that then constrains it; nothing stops a\nhostile co-resident module doing the same, and the protection is\ndeferred rather than refuted. And the fixture wears both hats, which\nproduction would not: a wallet asks for signatures and reads which\naccounts exist, and never imports a key.\n\nThe call comes from the module rather than a command line because\n`logos-standalone-app` has no CLI \u2014 and the host anchor a CLI\nauthenticates as is refused by Tier B regardless, which is why\n`signer_probe` exists at all. It takes effect on the next call;\nnothing is reloaded."}, {"execs": [{"cmd": "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/evm_signer_ui -m ./tree/modules --load signer_probe -u ./userdir\n\n# test actions:\n- The signer UI connects to its backend: wait for ['Refresh']\n- The keystore parks the request and the UI claims it: wait for ['1.  Requested by: signer_probe']\n- The screen is in three sections, and says which is whose: wait for ['2.  What you are signing', '3.  What this signer makes of section 2']\n- The human is shown the keystore's own words, not the requester's: wait for ['Account: 0xf39Fd6e51aad88F EAEAAAABCIAAAAgEAEAAACBCAAAAAhEAAAAQCACAAAAAhEAAAAQiAAAAIBABAAAAAQiAAAAIJD/D9OZmXH7Xid9AAAAAElFTkSuQmCC)"}, {"execs": [], "md": "## Step 3: The same plugin inside Basecamp\n\nThe section above runs the signer in `logos-standalone-app`, which is what\nmakes the flow drivable: the QML inspector attaches to exactly **one**\nQQuickWidget, and Basecamp gives every `ui_qml` plugin its own. Once a\nplugin is open there, the shell \u2014 and therefore any second app \u2014 is\ninvisible to the driver, so the two-app version of this flow (a wallet\nasking, the signer approving) cannot be driven end-to-end today. That is a\nlimitation of the test driver, not of the plugin.\n\nWhat Basecamp *does* add is the real shell: the QML sandbox, the shared\n`Logos.*` module resolution, and the portable variant contract. So this\nsection asserts exactly that much \u2014 the plugin installs, loads, and renders\nthere \u2014 and nothing it cannot honestly show."}, {"execs": [{"cmd": "set -euo pipefail\nnix build 'github:logos-co/logos-basecamp#bin-bundle-dir-inspector' --no-write-lock-file -o result-basecamp\nnix build 'github:logos-co/logos-evm-keystore-module#install-portable' --no-write-lock-file -o result-keystore-p\nnix build 'github:logos-co/logos-evm-signer-ui/cf2f23513d1e302f877253316d0b789543312abf#install-portable' --no-write-lock-file -o result-signer-p\nmkdir -p bctree/modules bctree/plugins\ncp -r result-keystore-p/modules/* bctree/modules/\ncp -r result-signer-p/plugins/*   bctree/plugins/\nchmod -R u+w bctree\n# Assert the PROPERTY, not one platform's spelling of it. The variant\n# is linux-amd64 here and darwin-* elsewhere, so matching the literal\n# string only ever passed on Linux. What matters is that it is the\n# portable build: a \"-dev\" variant installs without complaint and then\n# never loads, with only a \"not supported on this platform\" warning.\nvariant=\"$(cat bctree/plugins/evm_signer_ui/variant)\"\ncase \"$variant\" in\n  *-dev) echo \"WRONG VARIANT (dev bu <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
