<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"failed": 0, "passed": 19, "skipped": 0}, "tutorials": [{"meta": {"name": "Approving a signature: request, render, password, signature", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Approving a signature: request, render, password, signature\n\nThis doc-test proves the whole point of `evm_signer_ui`: **a module can ask for a\nsignature, but only a human can produce one.**\n\nIt runs the real chain headlessly \u2014 a requesting module, the signer manager, the\nkeystore, and the signer UI \u2014 and drives the UI the way a person would, through\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp):\n\n1. `signer_probe` names who holds the roles: the keystore's custodian\n   (`signer_probe`) and manager (`signer_manager_module`), and the manager's\n   approver (`evm_signer_ui`) and signer (`keystore_module`).\n2. `signer_probe` (a requester) imports a known key and asks the manager for a\n   signature on a message.\n3. The manager parks the request and announces it.\n4. `evm_signer_ui` \u2014 the only module allowed to approve \u2014 acknowledges receipt and\n   renders **the manager's own words**, verbatim.\n5. The password is typed into the UI and Approve is clicked; the manager has the\n   keystore sign and checks the signatures.\n6. The requester collects a real secp256k1 signature with its receipt.\n7. `signer_probe`, playing the keys app, unlocks the account for its own requests, each\n   signature confirmed, and asks again: the signer says the account is unlocked, shows no\n   password field, and the approval needs nothing typed.\n\nEvery refusal on the way is asserted too, because they are the design: the\nrequester can ask and collect but can never approve, and nothing signs until\nthe human acts.\n\n**What you'll build:** The keystore, the signer manager, the signer UI and a requesting module, run together in a headless ap s/\ncp -r result-tokenlist/modules/*  tree/modules/\ncp -r result-signer/plugins/*     tree/plugins/\n```"}, {"execs": [], "md": "## Step 2: Run it and approve a signature\n\nThe host loads the requester with `--load` and shows the signer UI. Two\nenvironment variables matter and are not optional:\n\n- `QT_FORCE_STDERR_LOGGING=1` \u2014 otherwise Qt routes the app's own\n  diagnostics to journald and a failure prints **nothing at all**.\n- `QML_INSPECTOR_PORT=3768` \u2014 the QML inspector is compiled in but only\n  listens when this is set."}, {"execs": [], "md": "### 2.1 Name who holds the roles\n\nNothing here may touch the keystore or the manager until each is told\nwho holds its roles. `signer_manager_module` gates **approval**\n(`pending`, `acknowledge`, `approve`, `reject`) on a configured\n*approver* and asks only its configured *signers* to sign.\n`keystore_module` gates **account mutation** (`import_private_key` and\nits siblings) on a configured *custodian*, and **signing** on a\nconfigured *manager*. `signer_probe` imports a key, so it needs the\nkeystore's custodian role \u2014 without it the run stops on its very first\ncall with the keystore's uniform refusal, `not authorized`.\n\nSo `signer_probe` makes two calls before anything else:\n\n```json\nkeystore_module.configure({\"custodians\": \"signer_probe\", \"managers\": \"signer_manager_module\"})\nsigner_manager_module.configure({\"approvers\": \"evm_signer_ui\", \"custodians\": [\"evm_keystore_ui\", \"signer_probe\"], \"signers\": \"keystore_module\"})\n```\n\n**Every role in each call, deliberately.** `configure` is *total*, not\na patch: the document is the whole answer to who holds these roles, so\none it does not name is held by **nobody** \u2014 an empty name admits no\ncaller. Leaving out the manager's approver would refuse `evm_signer_ui`\nitself, which is the half of this doc-test that matters; leaving out\nits signers would leave nothing to sign with.\n\n**Who gets which, and why.** The approver stays `evm_signer_ui`: it is the\nsubject here, the surface a human reads and clicks, and moving that\nrole anywhere else would leave nothing to test. The keystore's custodian\nis `signer_probe`, because in this staged tree there is no other\ncandidate \u2014 production's custodian is `evm_keystore_ui`, which is not\ninstalled here, and a role naming an absent module admits nobody.\n\nTwo honest caveats. `configure` is **ungated for now**, so this is the\nrequester writing the policy that then constrains it; nothing stops a\nhostile co-resident module doing the same, and the protection is\ndeferred rather than refuted. And the fixture wears both hats, which\nproduction would not: a wallet asks for signatures and reads which\naccounts exist, and never imports a key.\n\nThe calls come from the module rather than a command line because\n`logos-standalone-app` has no CLI \u2014 and the host anchor a CLI\nauthenticates as is refused by the manager regardless, which is why\n`signer_probe` exists at all. They take effect on the next call;\nnothing is reloaded."}, {"execs": [{"actions": [{"description": "The signer UI connects to its backend: wait for ['Refresh']", "duration_ms": 0, "index": 1, "status": "pass"}, {"description": "The manager parks the request and the UI claims it: wait for ['1.  Requested by: signer_probe']", "duration_ms": 1003, "index": 2, "status": "pass"}, {"description": "The screen is in three sections, and says which is whose: wait for ['2.  What you are signing', '3.  What this signer makes of section 2']", "duration_ms": 0, "index": 3, "status": "pass"}, {"description": "The human is shown the manager's own words, not the requester's: wait for ['Account: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266', 'Purpose (claimed by the requester): Doc-test: sign one message end to end', '3 item(s) to sign:', '      Text: I authorise the doc-test transfer']", "duration_ms": 1, "index": 4, "status": "pass"}, {"description": "The calldata is decoded on this <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
