ss app and driven through the real QML surface to produce one signature.\n\n**What you'll learn:**\n\n- Why signing needs an approver at all \u2014 and what the signer manager shows the human\n- How approving, requesting and account mutation are separated by caller identity\n- Why naming one role means naming them all, and what an unnamed role admits\n- Why the requester re-offers when nobody is listening, and what it tells the user\n- How to drive a Logos UI plugin headlessly and assert on what it rendered\n\n## Prerequisites\n\n- **Nix** with flakes enabled (see [nixos.org](https://nixos.org/download.html)).\n\n- **A Linux or macOS machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so no display is required."}, {"execs": [], "md": "## Step 1: Build the pieces\n\nFour modules and a host. `signer_probe` is a doc-test fixture that lives\nin this repo: something has to *ask* for a signature, and it has to be a\nnamed module, because the manager refuses the host anchor and therefore\nrefuses the CLI. It also imports the key it later asks to sign with, which\nis account mutation \u2014 so it has to hold the keystore's custodian role too;\nthe next section is where that is arranged."}, {"execs": [{"cmd": "set -euo pipefail\nnix build 'github:logos-co/logos-standalone-app' --no-write-lock-file -o result-app\nnix build 'github:logos-co/logos-qt-mcp' --no-write-lock-file -o result-mcp\n", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-standalone-app/7049fe63f5df39ac42ab2a0f300698bfb58e6430' into the Git cache...\ncopying path '/nix/store/s2pvcnbp8qrskqvl4jdvpd5xhp6m2c44-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/a30408ybri874zphhix5mrcv6x6jq46y-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/v9b35qf2xrs9fmdcwz3pslmnwhhvvywv-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/i618235z3h6ww4h0na04gyyy8s50ma49-source' from 'https://c modules/*   tree/modules/\ncp -r result-manager/modules/*    tree/modules/\ncp -r result-probe/modules/*      tree/modules/\ncp -r result-device/modules/*     tree/modules/\ncp -r result-capability/modules/* tree/modules/\ncp -r result-tokenlist/modules/*  tree/modules/\ncp -r result-signer/plugins/*     tree/plugins/\n```"}, {"execs": [], "md": "## Step 2: Run it and approve a signature\n\nThe host loads the requester with `--load` and shows the signer UI. Two\nenvironment variables matter and are not optional:\n\n- `QT_FORCE_STDERR_LOGGING=1` \u2014 otherwise Qt routes the app's own\n  diagnostics to journald and a failure prints **nothing at all**.\n- `QML_INSPECTOR_PORT=3768` \u2014 the QML inspector is compiled in but only\n  listens when this is set."}, {"execs": [], "md": "### 2.1 Name who holds the roles\n\nNothing here may touch the keystore or the manager until each is told\nwho holds its roles. `signer_manager_module` gates **approval**\n(`pending`, `acknowledge`, `approve`, `reject`) on a configured\n*approver* and asks only its configured *signers* to sign.\n`keystore_module` gates **account mutation** (`import_private_key` and\nits siblings) on a configured *custodian*, and **signing** on a\nconfigured *manager*. `signer_probe` imports a key, so it needs the\nkeystore's custodian role \u2014 without it the run stops on its very first\ncall with the keystore's uniform refusal, `not authorized`.\n\nSo `signer_probe` makes two calls before anything else:\n\n```json\nkeystore_module.configure({\"custodians\": \"signer_probe\", \"managers\": \"signer_manager_module\"})\nsigner_manager_module.configure({\"approvers\": \"evm_signer_ui\", \"custodians\": [\"evm_keystore_ui\", \"signer_probe\"], \"signers\": [\"keystore_module\", \"mock_device_signer\"]})\n```\n\n**Every role in each call, deliberately.** `configure` is *total*, not\na patch: the document is the whole answer to who holds these roles, so\none it does not name is held by **nobody** \u2014 an empty name admits no\ncaller. Leaving out the manager's approver would refuse `evm_signer_ui`\nitself, which is the half of this doc-test that matters; leaving out\nits signers would leave nothing to sign with.\n\n**Who gets which, and why.** The approver stays `evm_signer_ui`: it is the\nsubject here, the surface a human reads and clicks, and moving that\nrole anywhere else would leave nothing to test. The keystore's custodian\nis `signer_probe`, because in this staged tree there is no other\ncandidate \u2014 production's custodian is `evm_keystore_ui`, which is not\ninstalled here, and a role naming an absent module admits nobody.\n\nTwo honest caveats. `configure` is **ungated for now**, so this is the\nrequester writing the policy that then constrains it; nothing stops a\nhostile co-resident module doing the same, and the protection is\ndeferred rather than refuted. And the fixture wears both hats, which\nproduction would not: a wallet asks for signatures and reads which\naccounts exist, and never imports a key.\n\nThe calls come from the module rather than a command line because\n`logos-standalone-app` has no CLI \u2014 and the host anchor a CLI\nauthenticates as is refused by the manager regardless, which is why\n`signer_probe` exists at all. They take effect on the next call;\nnothing is reloaded."}, {"execs": [{"actions": [{"description": "The signer UI connects to its backend: wait for ['Refresh']", "duration_ms": 3, "index": 1, "status": "pass"}, {"description": "The manager parks the request and the UI claims it: wait for ['1.  Requested by: signer_probe']", "duration_ms": 506, "index": 2, "status": "pass"}, {"description": "The screen is in three sections, and says which is whose: wait for ['2.  What you are signing', '3.  What this signer makes of section 2']", "duration_ms": 4, "index": 3, "status": "pass"}, {"description": "The human is shown the manager's own words, not the requester's: wait for ['Account: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266', 'Pu   function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
