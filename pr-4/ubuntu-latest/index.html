lugins\ncp -r result-keystore/modules/*   tree/modules/\ncp -r result-probe/modules/*      tree/modules/\ncp -r result-capability/modules/* tree/modules/\ncp -r result-signer/plugins/*     tree/plugins/\nchmod -R u+w tree\nls tree/modules tree/plugins\n", "exit_code": 0, "kind": "run", "note": "", "output": "tree/modules:\ncapability_module\nkeystore_module\nsigner_probe\n\ntree/plugins:\nsigner_ui\n", "status": "pass"}], "md": "### 1.11 Lay them out for the host\n\n`capability_module` is not bundled with the standalone host, and without\nit every token handshake times out and calls are refused \u2014 so it is\nstaged alongside the others rather than assumed.\n\n```bash\nmkdir -p tree/modules tree/plugins\ncp -r result-keystore/modules/*   tree/modules/\ncp -r result-probe/modules/*      tree/modules/\ncp -r result-capability/modules/* tree/modules/\ncp -r result-signer/plugins/*     tree/plugins/\n```"}, {"execs": [], "md": "## Step 2: Run it and approve a signature\n\nThe host loads the requester with `--load` and shows the signer UI. Two\nenvironment variables matter and are not optional:\n\n- `QT_FORCE_STDERR_LOGGING=1` \u2014 otherwise Qt routes the app's own\n  diagnostics to journald and a failure prints **nothing at all**.\n- `QML_INSPECTOR_PORT=3768` \u2014 the QML inspector is compiled in but only\n  listens when this is set."}, {"execs": [{"cmd": "env QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/signer_ui -m ./tree/modules --load signer_probe -u ./userdir\n\n# test actions:\n- The signer UI connects to its backend: wait for ['Refresh']\n- The keystore parks the request and the UI claims it: wait for ['Requested by: signer_probe']\n- The human is shown the keystore's own words, not the requester's: wait for ['Account: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266', 'Purpose (claimed by the requester): Doc-test: sign one message end to end', '2 item(s) to sign:', '      Text: I authorise the doc-test transfer']\n- The calldata is decoded on this device, and says so: wait for ['Interpretation \u2014 decoded on this device, not part of what is signed', 'Item [2]:', 'Interpreted: WETH \u2014 VERIFIED (this address is WETH on chain 1, and it declares this function)', '  Function: transfer(address,uint256)']\n- Type the vault password: set objectName='vaultPasswordField' to 'doctest-pw'\n- Approve arms only after the dwell: wait for ['Approve']\n- Approve: click 'Approve'\n- The keystore signed it, and the surface says so: wait for ['Approved \u2014 2 items signed']\n- The queue is empty again: wait for ['No signing requests are waiting.']", "kind": "ui_test", "note": "UI tests failed", "output": "\nRunning 1 test(s)...\n\n  \u001b[31m\u2717\u001b[0m Approving a signature: request, render, password, signature: Launch, approve, and collect the signature\n    Expected texts not found: [\"Requested by: signer_probe\"]\n\n0 passed, 1 failed\n\n\n\n--- app log ---\ns): \"keystore_module\"\nRemoteTransportConnection: Connecting to registry: \"local:logos_capability_module_d92fc96f8ff4\" at \"21:10:32.455\"\nRemoteTransportConnection: Registry connect attempt started (no peer contact yet): \"local:logos_capability_module_d92fc96f8ff4\"\nLogosAPIConsumer: Informing module token for module: \"signer_ui\" with token: \"redacted:c152ce3d\u2026\"\nRemoteTransportConnection: Requesting object: \"capability_module\" at \"21:10:32.455\"\n[LogosObject] RemoteTransportConnection: returning RemoteLogosObject for: \"capability_module\"\n[LogosObject] Created RemoteLogosObject wrapping QRemoteObjectReplica 184233408\n[LogosObject] LogosAPIConsumer: calling LogosObject::informModuleToken for \"signer_ui\"\nLogosAPIConsumer: informModuleToken completed with result: true\n[LogosObject] Destroying RemoteLogosObject 0\n[2026-09-03 21:10:32.480] [warning] [logos] [capability_module] Warning: QObject::connect: No such signal ::eventResponse(QString,QVariantList)\nLoaded UI plugin: \"/home/runner/work/_temp/doctest-test-xff5bh6p/tree/plugins/signer_ui\"\n[QmlInspector] Inspector server listening on port 3768\n[QmlInspector] Client connected from \"::1\"\n[QmlInspector] Client disconnected\n[QmlInspector] Client connected from \"::1\"\n[2026-09-03 21:10:33.934] [warning] [logos] [capability_module] Warning: QObject::connect: No such signal ::eventResponse(QString,QVariantList)\n[2026-09-03 21:10:33.935] [out] [signer_probe] SIGNER_PROBE_ERROR: import failed: not authorized\n[QmlInspector] Client disconnected", "status": "fail"}], "md": "### 2.1 Launch, approve, and collect the signature\n\n```bash\nenv QT_FORCE_STDERR_LOGGING=1 QML_INSPECTOR_PORT=3768 ./result-app/bin/logos-standalone-app -p ./tree/plugins/signer_ui -m ./tree/modules --load signer_probe -u ./userdir\n```\n\n![The calldata is decoded on this device, and says so](images/signer-ui-approval.png)\n\n![The queue is empty again](images/signer-ui-approved.png)"}, {"execs": [], "md": "## Step 3: The same plugin inside Basecamp\n\nThe section above runs the signer in `logos-standalone-app`, which is what\nmakes the flow drivable: the QML inspector attaches to exactly **one**\nQQuickWidget, and Basecamp gives every `ui_qml` plugin its own. Once a\nplugin is open there, the shell \u2014 and therefore any second app \u2014 is\ninvisible to the driver, so the two-app version of this flow (a wallet\nasking, the signer approving) cannot be driven end-to-end today. That is a\nlimitation of the test driver, not of the plugin.\n\nWhat Basecamp *does* add is the real shell: the QML sandbox, the shared\n`Logos.*` module resolution, and the portable variant contract. So this\nsection asserts exactly that much \u2014 the plugin installs, loads, and renders\nthere \u2014 and nothing it cannot honestly show."}, {"execs": [{"cmd": "set -euo pipefail\nnix build 'github:logos-co/logos-basecamp#bin-bundle-dir-inspector' --no-write-lock-file -o result-basecamp\nnix build 'github:logos-co/logos-evm-keystore-module#inst <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
